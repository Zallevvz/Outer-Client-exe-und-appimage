name: Build and Release OuterClient 6.3.1 FIX2

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  OC_VERSION: "6.3.1"

jobs:
  verify-source:
    name: Verify OuterClient 6.3.1 FIX2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify version and syntax
        shell: bash
        run: |
          set -eux
          echo "=== OUTERCLIENT 6.3.1 FIX2 WORKFLOW LOADED ==="
          grep -F 'APP_VERSION = "6.3.1"' outerclient.py
          grep -F 'OUTERCLIENT_SMOKE_TEST' outerclient.py
          grep -F 'CREATE_NO_WINDOW' outerclient.py
          grep -F 'def _v631_toggle_explore_overlay' outerclient.py
          grep -F 'def _v631_apply_linux_window_mode' outerclient.py
          grep -F 'def _v631_show_system_tools' outerclient.py
          python3 -m py_compile outerclient.py

  linux-appimage:
    name: Linux AppImage 6.3.1 FIX2
    needs: verify-source
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 tk-dev tcl-dev xvfb x11-utils
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Clean old files
        shell: bash
        run: |
          rm -rf build dist AppDir
          rm -f ./*.spec
          rm -f ./OuterClient-*.AppImage

      - name: Verify Pillow Tk helper exists
        shell: bash
        run: |
          python - <<'PY'
          import PIL
          import PIL.ImageTk
          import PIL._tkinter_finder
          import tkinter

          print("Pillow:", PIL.__version__)
          print("Tk:", tkinter.TkVersion)
          print("PIL._tkinter_finder: OK")
          PY

      - name: Prepare private CurseForge build secret
        shell: bash
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          key = os.environ.get("CURSEFORGE_API_KEY", "").strip()
          if not key:
              raise SystemExit(
                  "Missing GitHub Actions secret: CURSEFORGE_API_KEY"
              )

          Path("outerclient_build_secrets.py").write_text(
              "CURSEFORGE_API_KEY = " + repr(key) + "\n",
              encoding="utf-8",
          )
          print("Private CurseForge build secret prepared.")
          PY

      - name: Source UI smoke test
        shell: bash
        env:
          OUTERCLIENT_SMOKE_TEST: "1"
          HOME: ${{ runner.temp }}/outerclient-smoke-home
        run: |
          mkdir -p "$HOME"
          timeout 15s xvfb-run -a python - <<'PY'
          import inspect
          import json
          import time
          import traceback
          from pathlib import Path
          import outerclient
          import minecraft_launcher_lib

          # Keep the smoke test deterministic: the changelog is tested manually
          # below, so disable its delayed first-launch navigation here.
          Path.home().mkdir(parents=True, exist_ok=True)
          (Path.home() / ".outerclient-state.json").write_text(
              json.dumps({"whats_new_seen_version": "6.3.1"}),
              encoding="utf-8",
          )

          app = outerclient.OuterClient()

          callback_errors = []

          def callback_exception(exc_type, exc_value, exc_tb):
              callback_errors.append((exc_type, exc_value))
              traceback.print_exception(exc_type, exc_value, exc_tb)

          app.report_callback_exception = callback_exception

          app.update_idletasks()
          app.update()

          assert app.winfo_exists()
          assert outerclient.APP_VERSION == "6.3.1"
          print("Tk window class:", app.winfo_class())
          assert app.winfo_class().casefold() == "outerclient"

          # Dashboard/profile-switch regression.
          app.show_home()
          app.update_idletasks()
          app.update()
          selected = app.cfg["selected"]
          assert selected in app.cfg["profiles"]
          assert getattr(app, "_home_widgets_v63", None)

          # Explore target must never be blank.
          # Do not use the network in this GUI smoke test.
          real_search_modrinth = app.search_modrinth
          app.search_modrinth = lambda: None

          app.show_modrinth()
          app.update_idletasks()
          app.update()
          app.refresh_explore_target_v63()
          app.update_idletasks()

          target_text = app.explore_target_button_v63.cget("text")
          assert selected in target_text or app.modrinth_category == "Modpacki"

          # The target-profile button must be wired to the real selector.
          # Do not assert X11/Tk mapping or geometry-manager state under Xvfb:
          # those values are WM-dependent and caused false AppImage failures.
          if app.modrinth_category != "Modpacki":
              button = app.explore_target_button_v63
              assert getattr(button, "_command", None) is not None
              assert callable(button._command)

              print(
                  "Explore selector:",
                  "page=", app.active_page,
                  "category=", app.modrinth_category,
                  "profiles=", list(app.cfg.get("profiles", {})),
                  "button_state=", button.cget("state"),
              )

              # Call the real selector directly. This verifies launcher logic,
              # while the command assertion above verifies the button wiring.
              app.toggle_explore_target_menu_v631()
              app.update_idletasks()
              app.update()

              overlay = app.explore_overlay_v631
              assert overlay is not None
              assert overlay.winfo_exists()
              assert len(overlay.winfo_children()) >= 1

              app.close_explore_overlay_v631()

          old_results_widget = app.modrinth_results

          # Library must open without synchronous full rendering.
          app.show_content_library_v6()
          app.update_idletasks()
          app.update()
          assert hasattr(app, "library_results_v6")

          # Regression: a late Modrinth result must be ignored after Explore
          # widgets were destroyed.
          app.render_modrinth_results("Mody", [])
          app.render_modrinth_page()

          # Give any pending after() callback enough time to fire.
          deadline = time.time() + 0.30
          while time.time() < deadline:
              app.update()
              time.sleep(0.01)

          assert not callback_errors, callback_errors
          app.search_modrinth = real_search_modrinth

          # Manage Profile must create a responsive loading list.
          app.show_profile_manager(selected)
          app.update_idletasks()
          app.update()
          assert hasattr(app, "manage_list")

          # What's New logical structure.
          # Do not inspect CTkScrollableFrame through winfo_children(): its
          # actual content lives behind an internal canvas.
          app.show_whats_new_v61(mark_seen=False)
          app.update_idletasks()
          app.update()

          changelog_state = app._whats_new_state_v63
          assert changelog_state["header"] == app.t("v61_whats_new_title")
          assert changelog_state["versions"] == ["6.3.1", "6.3", "6.2", "6.1", "6.0"]
          assert changelog_state["current"] == "6.3.1"
          assert not callback_errors, callback_errors

          # Runtime API used by the repair button must support progress callbacks.
          params = inspect.signature(
              minecraft_launcher_lib.install.install_minecraft_version
          ).parameters
          assert "callback" in params
          assert hasattr(minecraft_launcher_lib.runtime, "install_jvm_runtime")
          assert hasattr(minecraft_launcher_lib.runtime, "get_executable_path")

          # General Settings must not expose a raw Discord Application ID.
          app.show_settings()
          app.update_idletasks()
          app.update()
          assert not hasattr(app, "settings_discord")

          # System tools page including taskbar integration.
          app.show_system_tools_settings()
          app.update_idletasks()
          app.update()

          assert not callback_errors, callback_errors

          app.after(200, app.destroy)
          app.mainloop()

          assert not callback_errors, callback_errors
          print("OuterClient 6.3.1 regression smoke test: OK")
          PY

      - name: Build PyInstaller bundle
        shell: bash
        run: |
          pyinstaller \
            --noconfirm \
            --clean \
            --onedir \
            --windowed \
            --name OuterClient \
            --add-data "assets:assets" \
            --collect-all customtkinter \
            --collect-all minecraft_launcher_lib \
            --collect-all PIL \
            --hidden-import PIL.ImageTk \
            --hidden-import PIL._tkinter_finder \
            --hidden-import outerclient_build_secrets \
            outerclient.py

      - name: Verify frozen bundle contains Pillow Tk helper
        shell: bash
        run: |
          set -eux

          if ! grep -R -a -q "_tkinter_finder" dist/OuterClient; then
            echo "Warning: helper name not directly visible in bundle; continuing with runtime smoke test."
          fi

          test -x dist/OuterClient/OuterClient

      - name: Create AppDir
        shell: bash
        run: |
          set -eux

          mkdir -p AppDir/usr/bin/OuterClient
          cp -a dist/OuterClient/. AppDir/usr/bin/OuterClient/
          cp assets/outerclient-logo.png AppDir/outerclient.png

          cat > AppDir/OuterClient.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=OuterClient
          Comment=OuterClient Minecraft Launcher
          Exec=OuterClient
          Icon=outerclient
          Categories=Game;
          Terminal=false
          StartupWMClass=Outerclient
          X-AppImage-Version=6.3.1
          EOF

          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/OuterClient/OuterClient" "$@"
          EOF

          chmod +x AppDir/AppRun
          chmod +x AppDir/usr/bin/OuterClient/OuterClient

      - name: Download appimagetool
        shell: bash
        run: |
          curl -L \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage \
            -o appimagetool.AppImage

          chmod +x appimagetool.AppImage

      - name: Build AppImage
        shell: bash
        env:
          ARCH: x86_64
          VERSION: "6.3.1"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          ./appimagetool.AppImage \
            AppDir \
            OuterClient-v6.3.1-x86_64.AppImage

          chmod +x OuterClient-v6.3.1-x86_64.AppImage
          test -f OuterClient-v6.3.1-x86_64.AppImage

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: OuterClient-v6.3.1-AppImage
          path: OuterClient-v6.3.1-x86_64.AppImage
          if-no-files-found: error

  windows-exe:
    name: Windows EXE 6.3.1 FIX2
    needs: verify-source
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Clean old files
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force build, dist -ErrorAction SilentlyContinue
          Remove-Item -Force *.spec -ErrorAction SilentlyContinue

      - name: Verify Pillow Tk helper exists
        shell: pwsh
        run: |
          python -c "import PIL, PIL.ImageTk, PIL._tkinter_finder, tkinter; print('PIL._tkinter_finder OK')"

      - name: Prepare private CurseForge build secret
        shell: pwsh
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          python -c "import os,pathlib; key=os.environ.get('CURSEFORGE_API_KEY','').strip(); (_ for _ in ()).throw(SystemExit('Missing GitHub Actions secret: CURSEFORGE_API_KEY')) if not key else pathlib.Path('outerclient_build_secrets.py').write_text('CURSEFORGE_API_KEY = ' + repr(key) + '\n', encoding='utf-8')"

      - name: Source import smoke test
        shell: pwsh
        run: |
          python -c "import outerclient; assert outerclient.APP_VERSION == '6.3.1'; assert hasattr(outerclient.OuterClient, 'show_content_library_v6'); assert hasattr(outerclient.OuterClient, 'profile_health_report_v6'); print('OuterClient 6.3.1 source import: OK')"

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name "OuterClient-v6.3.1" `
            --icon assets/outerclient.ico `
            --add-data "assets;assets" `
            --collect-all customtkinter `
            --collect-all minecraft_launcher_lib `
            --collect-all PIL `
            --hidden-import PIL.ImageTk `
            --hidden-import PIL._tkinter_finder `
            --hidden-import outerclient_build_secrets `
            outerclient.py

          if (-not (Test-Path "dist\OuterClient-v6.3.1.exe")) {
            throw "OuterClient-v6.3.1.exe was not created"
          }

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: OuterClient-v6.3.1-Windows
          path: dist/OuterClient-v6.3.1.exe
          if-no-files-found: error

  release:
    name: Make 6.3.1 Latest
    needs:
      - linux-appimage
      - windows-exe
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish OuterClient 6.3.1
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v6.3.1
          name: OuterClient v6.3.1
          make_latest: true
          generate_release_notes: true
          files: |
            release/OuterClient-v6.3.1-x86_64.AppImage
            release/OuterClient-v6.3.1.exe
