name: Build and Release OuterClient 6.3

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  OC_VERSION: "6.3"

jobs:
  verify-source:
    name: Verify OuterClient 6.3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify version and syntax
        shell: bash
        run: |
          set -eux
          grep -F 'APP_VERSION = "6.3"' outerclient.py
          python3 -m py_compile outerclient.py

  linux-appimage:
    name: Linux AppImage 6.3
    needs: verify-source
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 tk-dev tcl-dev xvfb x11-utils
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Clean old files
        shell: bash
        run: |
          rm -rf build dist AppDir
          rm -f ./*.spec
          rm -f ./OuterClient-*.AppImage

      - name: Verify Pillow Tk helper exists
        shell: bash
        run: |
          python - <<'PY'
          import PIL
          import PIL.ImageTk
          import PIL._tkinter_finder
          import tkinter

          print("Pillow:", PIL.__version__)
          print("Tk:", tkinter.TkVersion)
          print("PIL._tkinter_finder: OK")
          PY

      - name: Prepare private CurseForge build secret
        shell: bash
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          key = os.environ.get("CURSEFORGE_API_KEY", "").strip()
          if not key:
              raise SystemExit(
                  "Missing GitHub Actions secret: CURSEFORGE_API_KEY"
              )

          Path("outerclient_build_secrets.py").write_text(
              "CURSEFORGE_API_KEY = " + repr(key) + "\n",
              encoding="utf-8",
          )
          print("Private CurseForge build secret prepared.")
          PY

      - name: Source UI smoke test
        shell: bash
        env:
          OUTERCLIENT_SMOKE_TEST: "1"
          HOME: ${{ runner.temp }}/outerclient-smoke-home
        run: |
          mkdir -p "$HOME"
          timeout 15s xvfb-run -a python - <<'PY'
          import inspect
          import json
          from pathlib import Path
          import outerclient
          import minecraft_launcher_lib

          # Keep the smoke test deterministic: the changelog is tested manually
          # below, so disable its delayed first-launch navigation here.
          Path.home().mkdir(parents=True, exist_ok=True)
          (Path.home() / ".outerclient-state.json").write_text(
              json.dumps({"whats_new_seen_version": "6.3"}),
              encoding="utf-8",
          )

          app = outerclient.OuterClient()
          app.update_idletasks()
          app.update()

          assert app.winfo_exists()
          assert outerclient.APP_VERSION == "6.3"
          print("Tk window class:", app.winfo_class())
          assert app.winfo_class().casefold() == "outerclient"

          # Dashboard/profile-switch regression.
          app.show_home()
          app.update_idletasks()
          app.update()
          selected = app.cfg["selected"]
          assert selected in app.cfg["profiles"]
          assert getattr(app, "_home_widgets_v63", None)

          # Explore target must never be blank.
          app.show_modrinth()
          app.update_idletasks()
          app.update()
          app.refresh_explore_target_v63()
          app.update_idletasks()
          target_text = app.explore_target_button_v63.cget("text")
          assert selected in target_text or app.modrinth_category == "Modpacki"

          # Library must open without synchronous full rendering.
          app.show_content_library_v6()
          app.update_idletasks()
          app.update()
          assert hasattr(app, "library_results_v6")

          # Manage Profile must create a responsive loading list.
          app.show_profile_manager(selected)
          app.update_idletasks()
          app.update()
          assert hasattr(app, "manage_list")

          # What's New must have one page header, not a second nested 6.1 page.
          app.show_whats_new_v61(mark_seen=False)
          app.update_idletasks()
          app.update()
          root = app.content.winfo_children()[0]

          def texts(widget):
              result = []
              try:
                  value = widget.cget("text")
                  if isinstance(value, str):
                      result.append(value)
              except Exception:
                  pass
              for child in widget.winfo_children():
                  result.extend(texts(child))
              return result

          page_texts = texts(root)
          expected_title = app.t("v61_whats_new_title")
          assert page_texts.count(expected_title) == 1
          assert app.t("v63_whats_new_63_title") in page_texts
          assert app.t("v62_whats_new_62_title") in page_texts

          # Runtime API used by the repair button must support progress callbacks.
          params = inspect.signature(
              minecraft_launcher_lib.install.install_minecraft_version
          ).parameters
          assert "callback" in params
          assert hasattr(minecraft_launcher_lib.runtime, "install_jvm_runtime")
          assert hasattr(minecraft_launcher_lib.runtime, "get_executable_path")

          # System tools page including taskbar integration.
          app.show_system_tools_settings()
          app.update_idletasks()
          app.update()

          app.after(200, app.destroy)
          app.mainloop()
          print("OuterClient 6.3 regression smoke test: OK")
          PY

      - name: Build PyInstaller bundle
        shell: bash
        run: |
          pyinstaller \
            --noconfirm \
            --clean \
            --onedir \
            --windowed \
            --name OuterClient \
            --add-data "assets:assets" \
            --collect-all customtkinter \
            --collect-all minecraft_launcher_lib \
            --collect-all PIL \
            --hidden-import PIL.ImageTk \
            --hidden-import PIL._tkinter_finder \
            --hidden-import outerclient_build_secrets \
            outerclient.py

      - name: Verify frozen bundle contains Pillow Tk helper
        shell: bash
        run: |
          set -eux

          if ! grep -R -a -q "_tkinter_finder" dist/OuterClient; then
            echo "Warning: helper name not directly visible in bundle; continuing with runtime smoke test."
          fi

          test -x dist/OuterClient/OuterClient

      - name: Create AppDir
        shell: bash
        run: |
          set -eux

          mkdir -p AppDir/usr/bin/OuterClient
          cp -a dist/OuterClient/. AppDir/usr/bin/OuterClient/
          cp assets/outerclient-logo.png AppDir/outerclient.png

          cat > AppDir/OuterClient.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=OuterClient
          Comment=OuterClient Minecraft Launcher
          Exec=OuterClient
          Icon=outerclient
          Categories=Game;
          Terminal=false
          StartupWMClass=Outerclient
          X-AppImage-Version=6.3
          EOF

          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/OuterClient/OuterClient" "$@"
          EOF

          chmod +x AppDir/AppRun
          chmod +x AppDir/usr/bin/OuterClient/OuterClient

      - name: Download appimagetool
        shell: bash
        run: |
          curl -L \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage \
            -o appimagetool.AppImage

          chmod +x appimagetool.AppImage

      - name: Build AppImage
        shell: bash
        env:
          ARCH: x86_64
          VERSION: "6.3"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          ./appimagetool.AppImage \
            AppDir \
            OuterClient-v6.3-x86_64.AppImage

          chmod +x OuterClient-v6.3-x86_64.AppImage
          test -f OuterClient-v6.3-x86_64.AppImage

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: OuterClient-v6.3-AppImage
          path: OuterClient-v6.3-x86_64.AppImage
          if-no-files-found: error

  windows-exe:
    name: Windows EXE 6.3
    needs: verify-source
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Clean old files
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force build, dist -ErrorAction SilentlyContinue
          Remove-Item -Force *.spec -ErrorAction SilentlyContinue

      - name: Verify Pillow Tk helper exists
        shell: pwsh
        run: |
          python -c "import PIL, PIL.ImageTk, PIL._tkinter_finder, tkinter; print('PIL._tkinter_finder OK')"

      - name: Prepare private CurseForge build secret
        shell: pwsh
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          python -c "import os,pathlib; key=os.environ.get('CURSEFORGE_API_KEY','').strip(); (_ for _ in ()).throw(SystemExit('Missing GitHub Actions secret: CURSEFORGE_API_KEY')) if not key else pathlib.Path('outerclient_build_secrets.py').write_text('CURSEFORGE_API_KEY = ' + repr(key) + '\n', encoding='utf-8')"

      - name: Source import smoke test
        shell: pwsh
        run: |
          python -c "import outerclient; assert outerclient.APP_VERSION == '6.3'; assert hasattr(outerclient.OuterClient, 'show_content_library_v6'); assert hasattr(outerclient.OuterClient, 'profile_health_report_v6'); print('OuterClient 6.3 source import: OK')"

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name "OuterClient-v6.3" `
            --icon assets/outerclient.ico `
            --add-data "assets;assets" `
            --collect-all customtkinter `
            --collect-all minecraft_launcher_lib `
            --collect-all PIL `
            --hidden-import PIL.ImageTk `
            --hidden-import PIL._tkinter_finder `
            --hidden-import outerclient_build_secrets `
            outerclient.py

          if (-not (Test-Path "dist\OuterClient-v6.3.exe")) {
            throw "OuterClient-v6.3.exe was not created"
          }

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: OuterClient-v6.3-Windows
          path: dist/OuterClient-v6.3.exe
          if-no-files-found: error

  release:
    name: Make 6.3 Latest
    needs:
      - linux-appimage
      - windows-exe
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish OuterClient 6.3
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v6.3
          name: OuterClient v6.3
          make_latest: true
          generate_release_notes: true
          files: |
            release/OuterClient-v6.3-x86_64.AppImage
            release/OuterClient-v6.3.exe
