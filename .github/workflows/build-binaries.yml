name: Build OuterClient binaries

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  appimage:
    name: Linux AppImage
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y curl file libgl1

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build AppImage
        run: |
          chmod +x packaging/build_appimage.sh
          ./packaging/build_appimage.sh

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: OuterClient-v4.8.1-AppImage
          path: dist-release/OuterClient-v4.8.1-x86_64.AppImage
          if-no-files-found: error
          
  windows:
    name: Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build EXE
        shell: pwsh
        run: |
          ./packaging/build_windows.ps1

      - name: Upload EXE
        uses: actions/upload-artifact@v7
        with:
          name: OuterClient-v4.8.1-Windows
          path: dist-release/OuterClient-v4.8.1-windows-x86_64.exe
          if-no-files-found: error
