name: Build and Release OuterClient 7.2.0

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  OC_VERSION: "7.2.0"

jobs:
  verify-source:
    name: Verify OuterClient 7.2.0
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify version and syntax
        shell: bash
        run: |
          set -eux
          echo "=== OUTERCLIENT 7.2.0 WORKFLOW LOADED ==="
          grep -F 'APP_VERSION = "7.2.0"' outerclient.py
          grep -F 'def _v710_show_profile_manager' outerclient.py
          grep -F 'def _v710_apply_windows_taskbar' outerclient.py
          grep -F 'WS_EX_APPWINDOW' outerclient.py
          grep -F 'def _v710_duplicate_profile' outerclient.py
          grep -F 'def _v710_launch_installed' outerclient.py
          grep -F 'def _v710_show_crash_detector' outerclient.py
          grep -F 'def _v710_setup_drag_drop' outerclient.py
          grep -F 'def _v710_modrinth_card' outerclient.py
          grep -F 'def _v720_show_accounts_page' outerclient.py
          grep -F 'def _v720_download_queue_worker' outerclient.py
          grep -F 'def _v720_process_download_job' outerclient.py
          grep -F 'def _v720_upload_skin_worker' outerclient.py
          grep -F 'def _v720_change_name_worker' outerclient.py
          grep -F 'def _v700_open_external_url' outerclient.py
          grep -F 'def _v700_project_page_url' outerclient.py
          grep -F 'def _v700_host_desktop_env' outerclient.py
          grep -F 'def _v641_toggle_version_picker' outerclient.py
          grep -F 'def _v641_build_version_panel' outerclient.py
          grep -F 'self._create_version_wrap_v641 = version_wrap' outerclient.py
          grep -F 'def _v640_open_create_profile' outerclient.py
          grep -F 'def _v640_prepare_profile' outerclient.py
          grep -F 'def _v640_login_worker' outerclient.py
          grep -F 'def _v640_ensure_profile_java' outerclient.py
          grep -F 'def _v639_toggle_maximize' outerclient.py
          grep -F 'target.setMaximize(desired, desired)' outerclient.py
          grep -F 'def _v639_finish_window_transition' outerclient.py
          grep -F 'def _v638_run_kwin_no_border' outerclient.py
          grep -F 'dbus-send' outerclient.py
          grep -F 'gdbus' outerclient.py
          grep -F 'workspace.slotWindowNoBorder()' outerclient.py
          grep -F 'def _v637_run_kwin_no_border_script' outerclient.py
          grep -F 'workspace.slotWindowNoBorder()' outerclient.py
          grep -F 'workspace.activeWindow = target' outerclient.py
          grep -F 'def _v636_real_x11_clients' outerclient.py
          grep -F 'def _v636_native_decoration_state' outerclient.py
          grep -F 'Window No Border' outerclient.py
          grep -F 'def _v636_apply_linux_titlebar' outerclient.py
          grep -F 'def _v635_show_system_tools' outerclient.py
          grep -F 'def _v635_install_kwin_rule' outerclient.py
          grep -F 'def _v635_apply_linux_custom_titlebar' outerclient.py
          grep -F 'def _v634_show_diagnostics' outerclient.py
          grep -F 'def _v633_apply_linux_custom_titlebar' outerclient.py
          grep -F 'def _v633_show_system_tools' outerclient.py
          grep -F 'def _v633_show_diagnostics' outerclient.py
          grep -F 'def _v633_apply_linux_custom_titlebar' outerclient.py
          grep -F 'def _v633_show_system_tools' outerclient.py
          grep -F 'def _v632_toggle_explore_profile_popup' outerclient.py
          grep -F '_NET_FRAME_EXTENTS' outerclient.py
          grep -F 'OUTERCLIENT_SMOKE_TEST' outerclient.py
          grep -F 'CREATE_NO_WINDOW' outerclient.py
          grep -F 'def _v631_toggle_explore_overlay' outerclient.py
          grep -F 'def _v631_apply_linux_window_mode' outerclient.py
          grep -F 'def _v631_show_system_tools' outerclient.py
          python3 -m py_compile outerclient.py

  linux-appimage:
    name: Linux AppImage 7.2.0
    needs: verify-source
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 tk-dev tcl-dev xvfb x11-utils
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Clean old files
        shell: bash
        run: |
          rm -rf build dist AppDir
          rm -f ./*.spec
          rm -f ./OuterClient-*.AppImage

      - name: Verify Pillow Tk helper exists
        shell: bash
        run: |
          python - <<'PY'
          import PIL
          import PIL.ImageTk
          import PIL._tkinter_finder
          import tkinter

          print("Pillow:", PIL.__version__)
          print("Tk:", tkinter.TkVersion)
          print("PIL._tkinter_finder: OK")
          PY

      - name: Prepare private CurseForge build secret
        shell: bash
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          key = os.environ.get("CURSEFORGE_API_KEY", "").strip()
          if not key:
              raise SystemExit(
                  "Missing GitHub Actions secret: CURSEFORGE_API_KEY"
              )

          Path("outerclient_build_secrets.py").write_text(
              "CURSEFORGE_API_KEY = " + repr(key) + "\n",
              encoding="utf-8",
          )
          print("Private CurseForge build secret prepared.")
          PY

      - name: Source UI smoke test
        shell: bash
        env:
          OUTERCLIENT_SMOKE_TEST: "1"
          HOME: ${{ runner.temp }}/outerclient-smoke-home
        run: |
          mkdir -p "$HOME"

          timeout 15s xvfb-run -a python - <<'PY'
          import json
          import traceback
          from pathlib import Path

          import outerclient

          Path.home().mkdir(parents=True, exist_ok=True)
          (Path.home() / ".outerclient-state.json").write_text(
              json.dumps({"whats_new_seen_version": "7.2.0"}),
              encoding="utf-8",
          )

          callback_errors = []

          app = outerclient.OuterClient()

          def callback_exception(exc_type, exc_value, exc_tb):
              callback_errors.append((exc_type, exc_value))
              traceback.print_exception(exc_type, exc_value, exc_tb)

          app.report_callback_exception = callback_exception

          app.update_idletasks()
          app.update()

          assert app.winfo_exists(), "OuterClient did not create its main window"
          assert outerclient.APP_VERSION == "7.2.0", (
              f"Expected version 7.2.0, got {outerclient.APP_VERSION}"
          )

          # Release-blocking smoke test intentionally checks startup and
          # critical method wiring only. Visual layout belongs to manual/UI
          # tests; Xvfb geometry must never block an AppImage build again.
          required_methods = [
              "show_home",
              "show_profiles",
              "show_modrinth",
              "show_settings",
              "show_diagnostics",
              "show_content_library_v6",
              "show_whats_new_v61",
              "show_system_tools_settings",
              "toggle_explore_profile_popup_v632",
              "apply_linux_custom_titlebar_v633",
              "open_skin_dialog_v720",
              "open_name_dialog_v720",
              "ensure_explore_index_v720",
              "process_patch_events_v720",
              "apply_windows_taskbar_v710",
              "setup_drag_drop_v710",
              "native_decoration_state_v636",
              "run_kwin_no_border_v638",
              "kwin_dbus_tools_v638",
              "run_kwin_maximize_v639",
          ]

          for name in required_methods:
              method = getattr(app, name, None)
              assert callable(method), f"Missing callable OuterClient.{name}"

          # Keep one expected binding per method. Older implementations can
          # remain in outerclient.py as wrapper bases without being active.
          expected_bindings = {
              "show_diagnostics": outerclient._v634_show_diagnostics,
              "show_system_tools_settings": outerclient._v635_show_system_tools,
              "apply_linux_custom_titlebar_v633": outerclient._v638_apply_linux_titlebar,
              "apply_linux_window_mode_v63": outerclient._v638_apply_linux_titlebar,
              "custom_toggle_maximize_v5101": outerclient._v639_toggle_maximize,
              "open_create_profile": outerclient._v710_open_create_profile,
              "toggle_version_picker_v640": outerclient._v641_toggle_version_picker,
              "select_create_version_v640": outerclient._v641_select_create_version,
              "open_external_url": outerclient._v700_open_external_url,
              "show_project_details": outerclient._v700_show_project_details,
              "show_accounts_page": outerclient._v720_show_accounts_page,
              "modrinth_card": outerclient._v720_modrinth_card,
              "download_queue_worker": outerclient._v720_download_queue_worker,
              "mod_page_url": outerclient._v700_mod_url,
              "prepare_profile_for_launch": outerclient._v640_prepare_profile,
              "login_worker": outerclient._v640_login_worker,
              "download_profile_runtime_worker": outerclient._v640_download_runtime_worker,
              "show_home": outerclient._v710_show_home,
              "show_profile_manager": outerclient._v710_show_profile_manager,
              "show_content_library_v6": outerclient._v710_show_library,
              "launch_installed_v54": outerclient._v710_launch_installed,
              "monitor_minecraft_process": outerclient._v710_monitor_process,
              "show_settings": outerclient._v710_show_settings,
          }
          for name, expected in expected_bindings.items():
              actual = getattr(app, name, None)
              actual_function = getattr(actual, "__func__", actual)
              actual_name = getattr(actual_function, "__name__", type(actual_function).__name__)
              assert actual_function is expected, (
                  f"OuterClient.{name}: expected {expected.__name__}, got {actual_name}"
              )

          print(f"Verified {len(expected_bindings)} active method bindings.")

          if callback_errors:
              raise RuntimeError(f"Tk startup callback failures: {callback_errors}")

          app.destroy()
          print("OuterClient 7.2.0 startup smoke test: OK")
          PY



      - name: Build PyInstaller bundle
        shell: bash
        run: |
          pyinstaller \
            --noconfirm \
            --clean \
            --onedir \
            --windowed \
            --name OuterClient \
            --add-data "assets:assets" \
            --collect-all customtkinter \
            --collect-all minecraft_launcher_lib \
            --collect-all PIL \
            --collect-all tkinterdnd2 \
            --hidden-import PIL.ImageTk \
            --hidden-import PIL._tkinter_finder \
            --hidden-import outerclient_build_secrets \
            outerclient.py

      - name: Verify frozen bundle contains Pillow Tk helper
        shell: bash
        run: |
          set -eux

          if ! grep -R -a -q "_tkinter_finder" dist/OuterClient; then
            echo "Warning: helper name not directly visible in bundle; continuing with runtime smoke test."
          fi

          test -x dist/OuterClient/OuterClient

      - name: Create AppDir
        shell: bash
        run: |
          set -eux

          mkdir -p AppDir/usr/bin/OuterClient
          cp -a dist/OuterClient/. AppDir/usr/bin/OuterClient/
          cp assets/outerclient-logo.png AppDir/outerclient.png

          cat > AppDir/OuterClient.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=OuterClient
          Comment=OuterClient Minecraft Launcher
          Exec=OuterClient
          Icon=outerclient
          Categories=Game;
          Terminal=false
          StartupWMClass=Outerclient
          X-AppImage-Version=7.2.0
          EOF

          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/OuterClient/OuterClient" "$@"
          EOF

          chmod +x AppDir/AppRun
          chmod +x AppDir/usr/bin/OuterClient/OuterClient

      - name: Download appimagetool
        shell: bash
        run: |
          curl -L \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage \
            -o appimagetool.AppImage

          chmod +x appimagetool.AppImage

      - name: Build AppImage
        shell: bash
        env:
          ARCH: x86_64
          VERSION: "7.2.0"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          ./appimagetool.AppImage \
            AppDir \
            OuterClient-v7.2.0-x86_64.AppImage

          chmod +x OuterClient-v7.2.0-x86_64.AppImage
          test -f OuterClient-v7.2.0-x86_64.AppImage

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: OuterClient-v7.2.0-AppImage
          path: OuterClient-v7.2.0-x86_64.AppImage
          if-no-files-found: error

  windows-exe:
    name: Windows EXE 7.2.0
    needs: verify-source
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Clean old files
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force build, dist -ErrorAction SilentlyContinue
          Remove-Item -Force *.spec -ErrorAction SilentlyContinue

      - name: Verify Pillow Tk helper exists
        shell: pwsh
        run: |
          python -c "import PIL, PIL.ImageTk, PIL._tkinter_finder, tkinter; print('PIL._tkinter_finder OK')"

      - name: Prepare private CurseForge build secret
        shell: pwsh
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          python -c "import os,pathlib; key=os.environ.get('CURSEFORGE_API_KEY','').strip(); (_ for _ in ()).throw(SystemExit('Missing GitHub Actions secret: CURSEFORGE_API_KEY')) if not key else pathlib.Path('outerclient_build_secrets.py').write_text('CURSEFORGE_API_KEY = ' + repr(key) + '\n', encoding='utf-8')"

      - name: Source import smoke test
        shell: pwsh
        run: |
          python -c "import outerclient; assert outerclient.APP_VERSION == '7.2.0'; assert hasattr(outerclient.OuterClient, 'show_content_library_v6'); assert hasattr(outerclient.OuterClient, 'profile_health_report_v6'); print('OuterClient 7.2.0 source import: OK')"

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name "OuterClient-v7.2.0" `
            --icon assets/outerclient.ico `
            --add-data "assets;assets" `
            --collect-all customtkinter `
            --collect-all minecraft_launcher_lib `
            --collect-all PIL `
            --collect-all tkinterdnd2 `
            --hidden-import PIL.ImageTk `
            --hidden-import PIL._tkinter_finder `
            --hidden-import outerclient_build_secrets `
            outerclient.py

          if (-not (Test-Path "dist\OuterClient-v7.2.0.exe")) {
            throw "OuterClient-v7.2.0.exe was not created"
          }

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: OuterClient-v7.2.0-Windows
          path: dist/OuterClient-v7.2.0.exe
          if-no-files-found: error

  release:
    name: Make 7.2.0 Latest
    needs:
      - linux-appimage
      - windows-exe
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish OuterClient 7.2.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v7.2.0
          name: OuterClient v7.2.0
          make_latest: true
          generate_release_notes: true
          files: |
            release/OuterClient-v7.2.0-x86_64.AppImage
            release/OuterClient-v7.2.0.exe
