name: Build and Release OuterClient 7.4.0

on:
  pull_request:
    paths:
      - "outerclient.py"
      - "outerclient_v730*.py"
      - "outerclient_v731*.py"
      - "outerclient_v732*.py"
      - "outerclient_v740*.py"
      - "test_v730_core.py"
      - "test_outerclient_v731.py"
      - "test_outerclient_v732.py"
      - "test_outerclient_v740.py"
      - ".github/workflows/build-binaries-v740.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  OC_VERSION: "7.4.0"

jobs:
  verify-source:
    name: Verify OuterClient 7.4.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify syntax, bindings and tests
        shell: bash
        run: |
          set -eux
          python3 -m py_compile \
            outerclient.py \
            outerclient_v730.py outerclient_v730_patch.py outerclient_v730_launch.py outerclient_v730_duplicates.py outerclient_v730_versions.py \
            outerclient_v731.py outerclient_v731_patch.py \
            outerclient_v732.py outerclient_v732_patch.py \
            outerclient_v740.py outerclient_v740_patch.py \
            test_v730_core.py test_outerclient_v731.py test_outerclient_v732.py test_outerclient_v740.py
          python3 -m unittest -v test_v730_core.py test_outerclient_v731.py test_outerclient_v732.py test_outerclient_v740.py
          grep -F 'VERSION = "7.4.0"' outerclient_v740_patch.py
          grep -F 'def page_in' outerclient_v740_patch.py
          grep -F 'def toplevel_in' outerclient_v740_patch.py
          grep -F 'def decorate_button' outerclient_v740_patch.py
          grep -F 'def decorate_entry' outerclient_v740_patch.py
          grep -F 'def patch_progress' outerclient_v740_patch.py
          grep -F '"current": "7.4.0"' outerclient_v740_patch.py

  linux-appimage:
    name: Linux AppImage 7.4.0
    if: github.event_name == 'workflow_dispatch'
    needs: verify-source
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 tk-dev tcl-dev xvfb x11-utils
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Prepare private CurseForge build secret
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          key = os.environ.get("CURSEFORGE_API_KEY", "").strip()
          if not key:
              raise SystemExit("Missing GitHub Actions secret: CURSEFORGE_API_KEY")
          Path("outerclient_build_secrets.py").write_text("CURSEFORGE_API_KEY = " + repr(key) + "\n", encoding="utf-8")
          PY
      - name: Source UI smoke test
        env:
          OUTERCLIENT_SMOKE_TEST: "1"
          HOME: ${{ runner.temp }}/outerclient-smoke-home
        run: |
          mkdir -p "$HOME"
          timeout 20s xvfb-run -a python - <<'PY'
          import outerclient_v740 as appmod
          assert appmod.APP_VERSION == "7.4.0"
          app = appmod.OuterClient()
          required = [
              "repair_duplicates_v730",
              "finish_launch_session_v730",
              "cleanup_launch_footer_v731",
              "request_account_card_head_v720",
              "show_accounts_page",
              "show_whats_new_v61",
              "animate_page_in_v740",
              "scan_micro_interactions_v740",
              "scan_toplevels_v740",
              "animate_toplevel_v740",
          ]
          for name in required:
              assert callable(getattr(app, name, None)), name
          app.update_idletasks()
          app.update()
          app.show_whats_new_v61(mark_seen=False)
          app.update_idletasks()
          assert app._whats_new_state_v63["current"] == "7.4.0"
          app.destroy()
          print("OuterClient 7.4.0 animation smoke test: OK")
          PY
      - name: Build PyInstaller bundle
        run: |
          rm -rf build dist AppDir *.spec OuterClient-v7.4.0-x86_64.AppImage
          pyinstaller \
            --noconfirm --clean --onedir --windowed \
            --name OuterClient \
            --icon assets/outerclient.ico \
            --add-data "assets:assets" \
            --collect-all customtkinter \
            --collect-all minecraft_launcher_lib \
            --collect-all PIL \
            --collect-all tkinterdnd2 \
            --hidden-import PIL.ImageTk \
            --hidden-import PIL._tkinter_finder \
            --hidden-import outerclient_build_secrets \
            --hidden-import outerclient_v730_patch \
            --hidden-import outerclient_v730_launch \
            --hidden-import outerclient_v730_duplicates \
            --hidden-import outerclient_v730_versions \
            --hidden-import outerclient_v731_patch \
            --hidden-import outerclient_v732_patch \
            --hidden-import outerclient_v740_patch \
            outerclient_v740.py
      - name: Create AppImage
        env:
          ARCH: x86_64
          VERSION: "7.4.0"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          mkdir -p AppDir/usr/bin/OuterClient
          cp -a dist/OuterClient/. AppDir/usr/bin/OuterClient/
          cp assets/outerclient-logo.png AppDir/outerclient.png
          cat > AppDir/OuterClient.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=OuterClient
          Comment=OuterClient Minecraft Launcher
          Exec=OuterClient
          Icon=outerclient
          Categories=Game;
          Terminal=false
          StartupWMClass=Outerclient
          X-AppImage-Version=7.4.0
          EOF
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/OuterClient/OuterClient" "$@"
          EOF
          chmod +x AppDir/AppRun AppDir/usr/bin/OuterClient/OuterClient
          curl -L https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage -o appimagetool.AppImage
          chmod +x appimagetool.AppImage
          ./appimagetool.AppImage AppDir OuterClient-v7.4.0-x86_64.AppImage
          chmod +x OuterClient-v7.4.0-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: OuterClient-v7.4.0-AppImage
          path: OuterClient-v7.4.0-x86_64.AppImage
          if-no-files-found: error

  windows-exe:
    name: Windows EXE 7.4.0
    if: github.event_name == 'workflow_dispatch'
    needs: verify-source
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Prepare private CurseForge build secret
        shell: pwsh
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          python -c "import os,pathlib; key=os.environ.get('CURSEFORGE_API_KEY','').strip(); (_ for _ in ()).throw(SystemExit('Missing GitHub Actions secret: CURSEFORGE_API_KEY')) if not key else pathlib.Path('outerclient_build_secrets.py').write_text('CURSEFORGE_API_KEY = ' + repr(key) + '\n', encoding='utf-8')"
      - name: Source import smoke test
        shell: pwsh
        run: |
          python -c "import outerclient_v740 as m; assert m.APP_VERSION == '7.4.0'; assert hasattr(m.OuterClient,'animate_page_in_v740'); assert hasattr(m.OuterClient,'scan_micro_interactions_v740'); assert hasattr(m.OuterClient,'scan_toplevels_v740'); print('OuterClient 7.4.0 source import: OK')"
      - name: Build EXE
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force build, dist -ErrorAction SilentlyContinue
          Remove-Item -Force *.spec -ErrorAction SilentlyContinue
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name OuterClient-v7.4.0 `
            --icon assets/outerclient.ico `
            --add-data "assets;assets" `
            --collect-all customtkinter `
            --collect-all minecraft_launcher_lib `
            --collect-all PIL `
            --collect-all tkinterdnd2 `
            --hidden-import PIL.ImageTk `
            --hidden-import PIL._tkinter_finder `
            --hidden-import outerclient_build_secrets `
            --hidden-import outerclient_v730_patch `
            --hidden-import outerclient_v730_launch `
            --hidden-import outerclient_v730_duplicates `
            --hidden-import outerclient_v730_versions `
            --hidden-import outerclient_v731_patch `
            --hidden-import outerclient_v732_patch `
            --hidden-import outerclient_v740_patch `
            outerclient_v740.py
          if (-not (Test-Path dist/OuterClient-v7.4.0.exe)) { throw 'OuterClient-v7.4.0.exe was not created' }
      - uses: actions/upload-artifact@v4
        with:
          name: OuterClient-v7.4.0-Windows
          path: dist/OuterClient-v7.4.0.exe
          if-no-files-found: error

  release:
    name: Release 7.4.0
    if: github.event_name == 'workflow_dispatch'
    needs: [linux-appimage, windows-exe]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v7.4.0
          name: OuterClient 7.4.0
          make_latest: true
          generate_release_notes: true
          files: |
            release-assets/OuterClient-v7.4.0-x86_64.AppImage
            release-assets/OuterClient-v7.4.0.exe
