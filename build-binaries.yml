name: Build and Release OuterClient 5.3

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  OC_VERSION: "5.3"

jobs:
  verify-source:
    name: Verify OuterClient 5.3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify version
        shell: bash
        run: |
          set -eux
          grep -F 'APP_VERSION = "5.3"' outerclient.py

  linux-appimage:
    name: Linux AppImage 5.3
    needs: verify-source
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 tk-dev tcl-dev
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Clean old files
        shell: bash
        run: |
          rm -rf build dist AppDir
          rm -f ./*.spec
          rm -f ./OuterClient-*.AppImage

      - name: Verify Pillow Tk helper exists
        shell: bash
        run: |
          python - <<'PY'
          import PIL
          import PIL.ImageTk
          import PIL._tkinter_finder
          import tkinter

          print("Pillow:", PIL.__version__)
          print("Tk:", tkinter.TkVersion)
          print("PIL._tkinter_finder: OK")
          PY

      - name: Build PyInstaller bundle
        shell: bash
        run: |
          pyinstaller \
            --noconfirm \
            --clean \
            --onedir \
            --windowed \
            --name OuterClient \
            --add-data "assets:assets" \
            --collect-all customtkinter \
            --collect-all minecraft_launcher_lib \
            --collect-all PIL \
            --hidden-import PIL.ImageTk \
            --hidden-import PIL._tkinter_finder \
            outerclient.py

      - name: Verify frozen bundle contains Pillow Tk helper
        shell: bash
        run: |
          set -eux

          if ! grep -R -a -q "_tkinter_finder" dist/OuterClient; then
            echo "Warning: helper name not directly visible in bundle; continuing with runtime smoke test."
          fi

          test -x dist/OuterClient/OuterClient

      - name: Create AppDir
        shell: bash
        run: |
          set -eux

          mkdir -p AppDir/usr/bin/OuterClient
          cp -a dist/OuterClient/. AppDir/usr/bin/OuterClient/
          cp assets/outerclient-logo.png AppDir/outerclient.png

          cat > AppDir/OuterClient.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=OuterClient 5.3
          Comment=OuterClient Minecraft Launcher
          Exec=OuterClient
          Icon=outerclient
          Categories=Game;
          Terminal=false
          StartupWMClass=OuterClient
          X-AppImage-Version=5.3
          EOF

          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/OuterClient/OuterClient" "$@"
          EOF

          chmod +x AppDir/AppRun
          chmod +x AppDir/usr/bin/OuterClient/OuterClient

      - name: Download appimagetool
        shell: bash
        run: |
          curl -L \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage \
            -o appimagetool.AppImage

          chmod +x appimagetool.AppImage

      - name: Build AppImage
        shell: bash
        env:
          ARCH: x86_64
          VERSION: "5.3"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          ./appimagetool.AppImage \
            AppDir \
            OuterClient-v5.3-x86_64.AppImage

          chmod +x OuterClient-v5.3-x86_64.AppImage
          test -f OuterClient-v5.3-x86_64.AppImage

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: OuterClient-v5.3-AppImage
          path: OuterClient-v5.3-x86_64.AppImage
          if-no-files-found: error

  windows-exe:
    name: Windows EXE 5.3
    needs: verify-source
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Clean old files
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force build, dist -ErrorAction SilentlyContinue
          Remove-Item -Force *.spec -ErrorAction SilentlyContinue

      - name: Verify Pillow Tk helper exists
        shell: pwsh
        run: |
          python -c "import PIL, PIL.ImageTk, PIL._tkinter_finder, tkinter; print('PIL._tkinter_finder OK')"

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name "OuterClient-v5.3" `
            --icon assets/outerclient.ico `
            --add-data "assets;assets" `
            --collect-all customtkinter `
            --collect-all minecraft_launcher_lib `
            --collect-all PIL `
            --hidden-import PIL.ImageTk `
            --hidden-import PIL._tkinter_finder `
            outerclient.py

          if (-not (Test-Path "dist\OuterClient-v5.3.exe")) {
            throw "OuterClient-v5.3.exe was not created"
          }

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: OuterClient-v5.3-Windows
          path: dist/OuterClient-v5.3.exe
          if-no-files-found: error

  release:
    name: Make 5.3 Latest
    needs:
      - linux-appimage
      - windows-exe
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish OuterClient 5.3
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.3
          name: OuterClient v5.3
          make_latest: true
          generate_release_notes: true
          files: |
            release/OuterClient-v5.3-x86_64.AppImage
            release/OuterClient-v5.3.exe
